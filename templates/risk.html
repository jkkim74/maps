{% extends "base.html" %}
{% block content %}
<div id="risk-kpi"><div class="loading"><div class="spinner"></div>로딩 중...</div></div>

<div id="risk-kills"></div>

<section class="card" aria-labelledby="execution-safety-title">
  <div class="card-body">
    <h3 id="execution-safety-title">계좌 실행 안전 상태</h3>
    <p id="execution-safety-status" role="status">계좌 검증 기록을 불러오는 중입니다.</p>
    <p id="execution-safety-metrics"></p>
    <pre id="execution-safety-details" style="white-space:pre-wrap"></pre>
    <p>접수 여부가 불명확한 주문은 자동 재전송하지 않습니다. 잔고 차이는 입출금으로 자동 분류하지 않습니다.</p>
  </div>
</section>

<div class="grid-2">
  <div>
    <div class="section-header"><span class="section-title">전략별 리스크 게이지</span><hr></div>
    <div class="card"><div class="card-body" id="risk-gauges"><div class="loading"><div class="spinner"></div></div></div></div>
  </div>
  <div>
    <div class="section-header"><span class="section-title">보유 종목</span><hr></div>
    <div class="card"><div class="card-body" id="risk-holdings"><div class="loading"><div class="spinner"></div></div></div></div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
(async () => {
  const status = document.getElementById('execution-safety-status');
  const pct = value => value == null ? '확인 불가' : (Number(value) * 100).toFixed(2) + '%';
  try {
    const response = await fetch('/api/v1/risk/execution-safety');
    if (!response.ok) throw new Error('조회 실패');
    const data = await response.json();
    status.textContent = `${data.environment} · ${data.status === 'READY' ? '계좌 검증 완료 (전략별 진입 심사는 별도)' : '신규 매수 차단'} · 최근 확인: ${data.checked_at || '없음'} UTC`;
    document.getElementById('execution-safety-metrics').textContent = `입출금 보정 일일 수익률 ${pct(data.daily_return)} · 관측 기준 최대 낙폭 ${pct(data.observed_drawdown)} · 미전달 알림 ${data.undelivered_alerts}건`;
    document.getElementById('execution-safety-details').textContent = [
      ...data.block_reasons.map(reason => `차단 사유: ${reason}`),
      ...data.unknown_orders.map(order => `확인 필요 주문: ${order.ticker} ${order.side} ${order.quantity}주 · ${order.id} · 버전 ${order.version}`),
      ...data.adjustments.map(item => `확인 필요 잔고 차이: ${item.amount}원 · 기록 ${item.id} · 버전 ${item.version}`),
    ].join('\n');
  } catch (error) {
    status.textContent = '계좌 안전 상태를 확인할 수 없습니다. 주문 가능 상태로 간주하지 마세요.';
  }
})();
</script>
{% endblock %}
