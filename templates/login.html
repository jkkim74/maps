<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAPS 로그인</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .login-card {
      width: 320px; max-width: 90vw; padding: 32px 28px;
      background: var(--surface, #1b1f2a); border: 1px solid var(--border, #2a2f3a);
      border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    }
    .login-title { font-size: 20px; font-weight: 700; margin: 0 0 4px; color: var(--text, #e6e8ee); }
    .login-sub { font-size: 12px; color: var(--text-muted, #8a90a0); margin: 0 0 20px; }
    .login-field { margin-bottom: 14px; }
    .login-field label { display: block; font-size: 12px; color: var(--text-muted, #8a90a0); margin-bottom: 6px; }
    .login-field input {
      width: 100%; box-sizing: border-box; padding: 10px 12px;
      background: var(--bg, #11141c); color: var(--text, #e6e8ee);
      border: 1px solid var(--border, #2a2f3a); border-radius: 8px; font-size: 14px;
    }
    .login-btn {
      width: 100%; padding: 11px; margin-top: 6px; cursor: pointer;
      background: var(--accent, #3b82f6); color: #fff; border: 0; border-radius: 8px;
      font-size: 14px; font-weight: 600;
    }
    .login-error {
      font-size: 13px; color: #f87171; margin-bottom: 14px; padding: 8px 10px;
      background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); border-radius: 8px;
    }
  </style>
</head>
<body>
  <form class="login-card" method="post" action="/login">
    <h1 class="login-title">MAPS</h1>
    <p class="login-sub">Market-Adaptive Profit Management System</p>
    {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="login-field">
      <label for="username">아이디</label>
      <input id="username" name="username" type="text" autocomplete="username" autofocus>
    </div>
    <div class="login-field">
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="login-btn" type="submit">로그인</button>
  </form>
</body>
</html>
