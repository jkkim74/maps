{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>내 설정</h2>
  <p class="muted">여기서 바꾼 값은 <strong>내 화면에만</strong> 적용된다. 주문·스케줄러 같은 운영 설정은 관리자만 바꾼다.</p>
  <div id="me-summary" class="muted">불러오는 중…</div>
</section>

<section class="card">
  <h3>화면</h3>
  <label>로그인 후 시작 화면
    <select id="pref-landing">
      <option value="stock-analysis">주식 종목 분석</option>
      <option value="candidates">종목 후보</option>
      <option value="market">장세 · 팩터</option>
      <option value="analysis-picks">분석 워치리스트</option>
      <option value="blog">매매 기록</option>
    </select>
  </label>
  <label>종목 후보 최소 점수(표시 전용)
    <input id="pref-min-score" type="number" step="0.1" min="0">
  </label>
  <label>표시할 시장
    <span><input type="checkbox" class="pref-market" value="KOSPI"> KOSPI</span>
    <span><input type="checkbox" class="pref-market" value="KOSDAQ"> KOSDAQ</span>
  </label>

  <p>
    <button class="topbar-btn" id="save-prefs">설정 저장</button>
    <span id="prefs-status" class="muted"></span>
  </p>
</section>

<section class="card">
  <h3>비밀번호 변경</h3>
  <label>현재 비밀번호 <input id="pw-current" type="password"></label>
  <label>새 비밀번호 (8자 이상) <input id="pw-new" type="password"></label>
  <p>
    <button class="topbar-btn" id="change-pw">비밀번호 변경</button>
    <span id="pw-status" class="muted"></span>
  </p>
</section>
{% endblock %}

{% block extra_scripts %}
<script src="/static/js/settings.js?v={{ static_ver }}"></script>
{% endblock %}
