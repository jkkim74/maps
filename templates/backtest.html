{% extends "base.html" %}
{% block content %}

<!-- 실행 설정 -->
<div class="section-header"><span class="section-title">실행 설정</span><hr></div>
<div class="card"><div class="card-body">
  <div class="grid-2" style="align-items:start">
    <table class="bt-settings-table">
      <tbody>
        <tr>
          <td class="bt-label">전략</td>
          <td>
            <select id="bt-strategy" class="topbar-btn">
              <option value="pullback_v3">pullback_v3</option>
            </select>
          </td>
        </tr>
        <tr>
          <td class="bt-label">기간</td>
          <td>
            <input type="date" id="bt-start" class="topbar-btn"> ~
            <input type="date" id="bt-end" class="topbar-btn">
            <div class="text-muted mono" style="font-size:11px;margin-top:4px" id="bt-period"></div>
          </td>
        </tr>
        <tr>
          <td class="bt-label">대상</td>
          <td>
            <select id="bt-universe" class="topbar-btn" onchange="onBtUniverseChange()">
              <option value="all">전체 (거래대금 상위 30)</option>
              <option value="market">시장별</option>
              <option value="sector">업종별</option>
              <option value="theme">테마별</option>
              <option value="index">지수 구성종목</option>
              <option value="recent_ipo">신규상장</option>
              <option value="custom">직접 지정</option>
            </select>
            <select id="bt-universe-arg" class="topbar-btn" style="display:none"></select>
            <input type="text" id="bt-universe-tickers" class="topbar-btn"
                   style="display:none;width:260px" placeholder="티커 쉼표 구분 (예: 005930,000660)">
            <div class="text-muted" style="font-size:11px;margin-top:4px" id="bt-universe-note"></div>
          </td>
        </tr>
        <tr>
          <td class="bt-label">실행 방식</td>
          <td>
            <select id="bt-mode" class="topbar-btn">
              <option value="per_ticker">종목별 평균 (전략 체질검사)</option>
              <option value="portfolio">포트폴리오 리플레이 (계좌 시뮬레이션 · 10슬롯)</option>
            </select>
          </td>
        </tr>
        <tr>
          <td class="bt-label">비용 모델</td>
          <td class="text-muted" id="bt-cost">-</td>
        </tr>
      </tbody>
    </table>
    <div style="display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding-top:8px">
      <button class="bt-run-btn" onclick="runBacktest()">▶ 실행</button>
      <div class="text-muted" style="font-size:11px">즉시 실행 · 완료까지 수십 초 걸릴 수 있음</div>
    </div>
  </div>
</div></div>

<!-- 실행 진행률 -->
<div class="section-header"><span class="section-title">실행 진행률</span><hr></div>
<div class="card"><div class="card-body" id="bt-progress-section">
  <div class="loading"><div class="spinner"></div></div>
</div></div>

<!-- 결과 요약 -->
<div class="section-header"><span class="section-title">결과 요약</span><hr></div>
<div id="bt-result-kpi"><div class="loading"><div class="spinner"></div></div></div>

<!-- 최근 실행 목록 -->
<div class="section-header">
  <span class="section-title">최근 실행 목록</span><hr>
  <select id="bt-source" class="topbar-btn" onchange="loadBacktest()">
    <option value="">전체</option>
    <option value="manual">수동</option>
    <option value="scheduled_validation">자동</option>
  </select>
</div>
<div class="card"><div class="card-body" id="bt-runs-area">
  <div class="loading"><div class="spinner"></div></div>
</div></div>

{% endblock %}
