{% extends "base.html" %}
{% block topbar_actions %}
<button class="topbar-btn" style="color:var(--color-fail);border-color:var(--color-fail)" onclick="alert('Emergency stop requires Kill Switch approval workflow.')">Emergency Stop</button>
{% endblock %}
{% block content %}
<div id="orders-kpi"><div class="loading"><div class="spinner"></div></div></div>

<div class="section-header"><span class="section-title">Pending Orders</span><hr></div>
<div class="card"><div class="card-body" id="orders-pending">
  <div class="loading"><div class="spinner"></div></div>
</div></div>

<div class="section-header"><span class="section-title">Fills Today</span><hr></div>
<div class="card"><div class="card-body" id="orders-fills">
  <div class="loading"><div class="spinner"></div></div>
</div></div>

<div class="section-header"><span class="section-title">Expired Orders</span><hr></div>
<div class="card"><div class="card-body" id="orders-expired">
  <div class="loading"><div class="spinner"></div></div>
</div></div>
{% endblock %}
