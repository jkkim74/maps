{% extends "base.html" %}
{% block topbar_actions %}
<button class="topbar-btn" style="color:var(--color-fail);border-color:var(--color-fail)" onclick="alert('Emergency stop requires Kill Switch approval workflow.')">Emergency Stop</button>
{% endblock %}
{% block content %}

<div class="section-header"><span class="section-title">다음 거래일 예정 주문 미리보기</span><span class="text-muted" style="font-size:11px;margin-left:8px;">유동성 열은 20거래일 평균 거래대금 대비 주문 한도로 수량이 줄었는지 보여 준다</span><hr></div>
<div id="orders-preview-kpi"></div>
<div class="card"><div class="card-body" id="orders-preview-table">
  <div class="loading"><div class="spinner"></div></div>
</div></div>

<div id="orders-kpi"><div class="loading"><div class="spinner"></div></div></div>

<div class="section-header"><span class="section-title">미체결 주문 · 과거 주문 포함</span><hr></div>
<div class="card"><div class="card-body" id="orders-pending">
  <div class="loading"><div class="spinner"></div></div>
</div></div>

<div class="section-header"><span class="section-title">오늘 생성 주문의 누적 체결 (KST)</span><hr></div>
<div class="card"><div class="card-body" id="orders-fills">
  <div class="loading"><div class="spinner"></div></div>
</div></div>

<div class="section-header"><span class="section-title">오늘 및 지난 7일 만료 주문 · 최대 100건</span><hr></div>
<div class="card"><div class="card-body" id="orders-expired">
  <div class="loading"><div class="spinner"></div></div>
</div></div>
{% endblock %}
