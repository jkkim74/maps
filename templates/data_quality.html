{% extends "base.html" %}
{% block topbar_actions %}
<select class="topbar-btn" onchange="changeDataQualityMode(this.value)" id="mode-select">
  <option value="live">Live</option>
  <option value="backtest">Backtest</option>
</select>
{% endblock %}
{% block content %}
<div id="dq-kpi"><div class="loading"><div class="spinner"></div></div></div>

<div class="section-header"><span class="section-title">Rejection Reasons</span><hr></div>
<div class="card"><div class="card-body" id="dq-reasons">
  <div class="loading"><div class="spinner"></div></div>
</div></div>

<div class="section-header"><span class="section-title">Rejection Trend</span><hr></div>
<div class="chart-container">
  <div class="chart-title">Daily reject ratio with 5% threshold</div>
  <div id="dq-chart" style="min-height:220px">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script>
function changeDataQualityMode(mode) {
  const url = new URL(location.href);
  url.searchParams.set('mode', mode);
  location.href = url.toString();
}
document.addEventListener('DOMContentLoaded', () => {
  const mode = new URLSearchParams(location.search).get('mode') || 'live';
  document.getElementById('mode-select').value = mode;
});
</script>
{% endblock %}
