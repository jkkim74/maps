{% extends "base.html" %}
{% block content %}

<div class="section-header"><span class="section-title">일일 매매 기록</span><hr></div>

<div class="card"><div class="card-body">
  <label for="blog-date" style="margin-right:8px">날짜</label>
  <select id="blog-date" onchange="loadPost(this.value)" style="min-width:180px"></select>
  <span id="blog-count" style="margin-left:12px;opacity:.7"></span>
</div></div>

<div class="card"><div class="card-body">
  <div class="strat-guide-head">
    <span class="strat-rule-head" style="margin:0">네이버 블로그 붙여넣기용 원고</span>
    <button class="btn-copy" id="blog-copy-btn" onclick="copyGuideText(this, 'blog-text')">전체 복사</button>
  </div>
  <div class="strat-guide-text" id="blog-text">
    <div class="loading"><div class="spinner"></div></div>
  </div>
</div></div>

{% endblock %}
{% block extra_scripts %}
<style>
  /* 원고는 스마트에디터에 그대로 붙여넣는 평문이다. 화면에서 가공하면
     복사한 내용과 발행될 내용이 달라지므로 pre-wrap 으로 원문만 보여준다.
     높이 제한은 풀어야 한다 — 잘린 영역도 복사 대상이라 스크롤로 확인해야 한다. */
  #blog-text { max-height: none; }
</style>
<script>
// esc() 는 app.js 의 것을 쓴다. 여기서 다시 정의하면 전역을 덮어써서
// 다른 화면의 이스케이프가 느슨해진다(따옴표를 안 막던 구 구현이 그랬다).
async function loadPost(date) {
  const body = document.getElementById('blog-text');
  body.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {
    const res = await fetch(`/api/v1/blog/${encodeURIComponent(date)}`);
    if (!res.ok) throw new Error(`${res.status}`);
    const data = await res.json();
    body.textContent = data.content;
  } catch (e) {
    body.innerHTML = `<p>글을 불러오지 못했습니다 (${esc(e.message)}).</p>`;
  }
}

async function init() {
  const sel = document.getElementById('blog-date');
  const body = document.getElementById('blog-text');
  try {
    const res = await fetch('/api/v1/blog');
    const data = await res.json();
    document.getElementById('blog-count').textContent =
      `${data.entries.length}편 · ${data.directory}`;
    if (!data.entries.length) {
      body.innerHTML = '<p>아직 생성된 글이 없습니다. 저녁 배치(run_blog_cron.sh)가 돌면 채워집니다.</p>';
      return;
    }
    sel.innerHTML = data.entries.map(e => `<option value="${esc(e.date)}">${esc(e.date)}</option>`).join('');
    loadPost(data.entries[0].date);
  } catch (e) {
    body.innerHTML = `<p>목록을 불러오지 못했습니다 (${esc(e.message)}).</p>`;
  }
}

init();
</script>
{% endblock %}
