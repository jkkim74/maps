{% extends "base.html" %}
{% block extra_head %}
<link rel="stylesheet" href="/static/css/stock-analysis.css?v={{ static_ver }}">
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
{% endblock %}
{% block content %}

<div class="sa-search-bar">
  <input type="text" id="sa-input"
         placeholder="종목명 또는 종목코드 (예: 삼성전자, 005930)"
         autocomplete="off"
         onkeydown="if(event.key==='Enter') runAnalysis()">
  <button class="topbar-btn" id="sa-btn" onclick="runAnalysis()">▶ 분석</button>
</div>

<div id="sa-history-section" class="card sa-history">
  <div class="card-body">
    <div class="section-title">분석 이력</div>
    <div id="sa-history-status" class="sa-history-status"></div>
    <div class="sa-history-scroll">
      <table>
        <thead><tr>
          <th>분석 시각</th><th>종목</th><th>의견</th><th>분석 당시</th>
          <th>현재가</th><th>가격 확인</th><th>동작</th>
        </tr></thead>
        <tbody id="sa-history-body"></tbody>
      </table>
    </div>
  </div>
</div>

{% include "_stock_analysis_panel.html" %}

{% endblock %}
{% block extra_scripts %}
<script src="/static/js/stock-analysis.js?v={{ static_ver }}"></script>
<script>
/* 단독 화면 진입점 — 검색창 값으로 공유 딥다이브 실행 */
function runAnalysis() {
  const ticker = document.getElementById('sa-input').value.trim();
  if (!ticker) { alert('종목명 또는 종목코드를 입력하세요.'); return; }
  runStockAnalysis(ticker);
}
</script>
{% endblock %}
