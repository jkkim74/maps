{% extends "base.html" %}
{% block extra_head %}
<style>
/* ── 검색바 ── */
.sa-search-bar{display:flex;gap:10px;align-items:center;margin-bottom:24px}
.sa-search-bar input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:6px;
  background:var(--bg-card);color:var(--text-primary);font-size:1rem}
.sa-search-bar input:focus{outline:none;border-color:var(--accent)}

/* ── 진행률 패널 ── */
.sa-progress-panel{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;
  padding:20px 24px;margin-bottom:24px;display:none}
.sa-progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sa-progress-title{font-size:0.95rem;font-weight:600;color:var(--text-primary)}
.sa-progress-elapsed{font-size:0.78rem;color:var(--text-muted);font-variant-numeric:tabular-nums}
.sa-progress-step{font-size:0.82rem;color:var(--accent);margin-bottom:10px;min-height:1.2em}
.sa-progress-bar-wrap{background:var(--bg-hover);border-radius:4px;height:8px;overflow:hidden;margin-bottom:8px}
.sa-progress-bar{height:100%;background:linear-gradient(90deg,var(--accent),#7db8ff);
  border-radius:4px;transition:width .4s ease;width:0%}
.sa-progress-pct{font-size:0.75rem;color:var(--text-muted);text-align:right;margin-bottom:16px;
  font-variant-numeric:tabular-nums}
.sa-step-list{display:flex;flex-direction:column;gap:4px}
.sa-step-item{display:flex;align-items:center;gap:8px;font-size:0.78rem;color:var(--text-muted);
  padding:3px 0;transition:color .2s}
.sa-step-item.done{color:var(--text-primary)}
.sa-step-item.active{color:var(--accent);font-weight:600}
.sa-step-icon{width:14px;text-align:center;flex-shrink:0}
.sa-step-icon.spin{display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── 결과 섹션 ── */
.sa-result{display:none}
.sa-hero{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.sa-price{font-size:2rem;font-weight:700;color:var(--text-primary)}
.sa-change-pos{color:#4caf50;font-size:1.1rem;font-weight:600}
.sa-change-neg{color:#f44336;font-size:1.1rem;font-weight:600}
.sa-change-neu{color:var(--text-muted);font-size:1.1rem}
.sa-name{font-size:1.1rem;color:var(--text-muted)}
.sa-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.75rem;font-weight:600;margin-left:6px}
.sa-badge-green{background:#1b5e20;color:#a5d6a7}
.sa-badge-red{background:#b71c1c;color:#ef9a9a}
.sa-grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sa-grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sa-mini-card{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:12px 16px}
.sa-mini-label{font-size:.72rem;color:var(--text-muted);margin-bottom:4px}
.sa-mini-val{font-size:1.15rem;font-weight:600;color:var(--text-primary)}
.sa-mini-sub{font-size:.72rem;color:var(--text-muted);margin-top:2px}
.sa-indicator-row{display:flex;justify-content:space-between;align-items:center;
  padding:6px 0;border-bottom:1px solid var(--border)}
.sa-indicator-row:last-child{border-bottom:none}
.sa-indicator-label{font-size:.82rem;color:var(--text-muted)}
.sa-indicator-val{font-size:.9rem;font-weight:600;color:var(--text-primary)}
#sa-chart{width:100%;height:280px}
.sa-err{background:#1a0000;border:1px solid #b71c1c;border-radius:8px;
  padding:16px;color:#ef9a9a;font-size:.9rem}
</style>
{% endblock %}
{% block content %}

<div class="sa-search-bar">
  <input type="text" id="sa-input"
         placeholder="종목명 또는 종목코드 (예: 삼성전자, 005930)"
         autocomplete="off"
         onkeydown="if(event.key==='Enter') runAnalysis()">
  <button class="topbar-btn" id="sa-btn" onclick="runAnalysis()">▶ 분석</button>
</div>

<!-- ── 진행률 패널 ── -->
<div id="sa-progress" class="sa-progress-panel">
  <div class="sa-progress-header">
    <span class="sa-progress-title" id="prog-title">분석 준비 중…</span>
    <span class="sa-progress-elapsed" id="prog-elapsed">0초</span>
  </div>
  <div class="sa-progress-step" id="prog-step"></div>
  <div class="sa-progress-bar-wrap">
    <div class="sa-progress-bar" id="prog-bar"></div>
  </div>
  <div class="sa-progress-pct" id="prog-pct">0%</div>
  <div class="sa-step-list" id="prog-steps"></div>
</div>

<div id="sa-error" class="sa-err" style="display:none"></div>

<!-- ── 결과 ── -->
<div id="sa-result" class="sa-result">

  <div class="card" style="margin-bottom:16px">
    <div class="card-body">
      <div class="sa-hero">
        <span class="sa-name" id="r-name"></span>
        <span class="mono" id="r-code" style="font-size:.85rem;color:var(--text-muted)"></span>
      </div>
      <div style="display:flex;align-items:baseline;gap:16px">
        <span class="sa-price" id="r-price"></span>
        <span id="r-change"></span>
        <span id="r-align-badge"></span>
      </div>
      <div style="font-size:.78rem;color:var(--text-muted);margin-top:6px" id="r-date"></div>
    </div>
  </div>

  <div class="sa-grid2" style="margin-bottom:16px">
    <div class="card">
      <div class="card-body">
        <div class="section-title" style="font-size:.85rem;margin-bottom:10px">가격 차트 (6개월)</div>
        <div id="sa-chart"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-body">
        <div class="section-title" style="font-size:.85rem;margin-bottom:10px">기술적 지표</div>
        <div id="r-technicals"></div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-body">
      <div class="section-title" style="font-size:.85rem;margin-bottom:10px">이동평균선</div>
      <div class="sa-grid4" id="r-ma"></div>
    </div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <div class="card-body">
      <div class="section-title" style="font-size:.85rem;margin-bottom:10px">밸류에이션</div>
      <div class="sa-grid4" id="r-valuation"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="section-title" style="font-size:.85rem;margin-bottom:10px">재무제표 (3개년)</div>
      <div id="r-financials"></div>
    </div>
  </div>

</div>
{% endblock %}
{% block extra_scripts %}
<script>
/* ── 분석 단계 정의 ───────────────────────────────────────── */
const STEP_DEFS = [
  { key: 'resolve',      label: '종목코드 확인',           pctFrom: 0  },
  { key: 'technicals',   label: '시세 · 기술적 지표 수집', pctFrom: 10 },
  { key: 'fundamentals', label: '밸류에이션 조회',          pctFrom: 40 },
  { key: 'dart_corp',    label: 'DART 법인코드 조회',       pctFrom: 55 },
  { key: 'financials',   label: '재무제표 수집 (3개년)',    pctFrom: 70 },
];

function stepKeyFromPct(pct) {
  for (let i = STEP_DEFS.length - 1; i >= 0; i--) {
    if (pct >= STEP_DEFS[i].pctFrom) return STEP_DEFS[i].key;
  }
  return STEP_DEFS[0].key;
}

/* ── 진행률 UI 업데이트 ──────────────────────────────────── */
let _elapsedTimer = null;
let _startTime = null;
let _activeEs = null;

function startProgress(ticker) {
  _startTime = Date.now();
  document.getElementById('sa-progress').style.display = 'block';
  document.getElementById('sa-error').style.display = 'none';
  document.getElementById('sa-result').style.display = 'none';
  document.getElementById('prog-title').textContent = `${ticker} 분석 진행 중…`;
  document.getElementById('prog-step').textContent = '';
  document.getElementById('prog-bar').style.width = '0%';
  document.getElementById('prog-pct').textContent = '0%';

  // 단계 체크리스트 초기화
  document.getElementById('prog-steps').innerHTML = STEP_DEFS.map(s =>
    `<div class="sa-step-item" id="step-${s.key}">
       <span class="sa-step-icon">○</span>${s.label}
     </div>`
  ).join('');

  // 경과시간 카운터
  if (_elapsedTimer) clearInterval(_elapsedTimer);
  _elapsedTimer = setInterval(() => {
    const sec = Math.floor((Date.now() - _startTime) / 1000);
    document.getElementById('prog-elapsed').textContent = `${sec}초 경과`;
  }, 1000);
}

function updateProgress(step, pct) {
  document.getElementById('prog-step').textContent = step;
  document.getElementById('prog-bar').style.width = pct + '%';
  document.getElementById('prog-pct').textContent = pct + '%';

  const activeKey = stepKeyFromPct(pct);
  STEP_DEFS.forEach(s => {
    const el = document.getElementById(`step-${s.key}`);
    if (!el) return;
    const icon = el.querySelector('.sa-step-icon');
    if (s.pctFrom < STEP_DEFS.find(x => x.key === activeKey).pctFrom) {
      el.className = 'sa-step-item done';
      icon.className = 'sa-step-icon';
      icon.textContent = '✓';
    } else if (s.key === activeKey) {
      el.className = 'sa-step-item active';
      icon.className = 'sa-step-icon spin';
      icon.textContent = '◐';
    } else {
      el.className = 'sa-step-item';
      icon.className = 'sa-step-icon';
      icon.textContent = '○';
    }
  });
}

function stopProgress() {
  if (_elapsedTimer) { clearInterval(_elapsedTimer); _elapsedTimer = null; }
  // 모든 단계 완료 표시
  STEP_DEFS.forEach(s => {
    const el = document.getElementById(`step-${s.key}`);
    if (!el) return;
    el.className = 'sa-step-item done';
    const icon = el.querySelector('.sa-step-icon');
    icon.className = 'sa-step-icon';
    icon.textContent = '✓';
  });
}

/* ── 분석 실행 (SSE) ─────────────────────────────────────── */
async function runAnalysis() {
  const ticker = document.getElementById('sa-input').value.trim();
  if (!ticker) { alert('종목명 또는 종목코드를 입력하세요.'); return; }

  // 기존 스트림 종료
  if (_activeEs) { _activeEs.close(); _activeEs = null; }

  document.getElementById('sa-btn').disabled = true;
  document.getElementById('sa-btn').textContent = '분석 중…';
  startProgress(ticker);

  const url = `/api/v1/stock-analysis/stream?ticker=${encodeURIComponent(ticker)}`;
  const es = new EventSource(url);
  _activeEs = es;

  es.onmessage = (e) => {
    let d;
    try { d = JSON.parse(e.data); } catch { return; }

    if (!d.done) {
      updateProgress(d.step, d.pct);
      return;
    }

    // 완료
    es.close();
    _activeEs = null;
    stopProgress();
    document.getElementById('sa-btn').disabled = false;
    document.getElementById('sa-btn').textContent = '▶ 분석';

    if (d.error) {
      document.getElementById('sa-progress').style.display = 'none';
      document.getElementById('sa-error').textContent = '오류: ' + d.error;
      document.getElementById('sa-error').style.display = 'block';
    } else {
      const sec = Math.floor((Date.now() - _startTime) / 1000);
      document.getElementById('prog-step').textContent = `완료 (${sec}초 소요)`;
      document.getElementById('prog-bar').style.width = '100%';
      document.getElementById('prog-pct').textContent = '100%';
      setTimeout(() => {
        document.getElementById('sa-progress').style.display = 'none';
        renderResult(d.data);
      }, 600);
    }
  };

  es.onerror = () => {
    es.close();
    _activeEs = null;
    stopProgress();
    document.getElementById('sa-btn').disabled = false;
    document.getElementById('sa-btn').textContent = '▶ 분석';
    document.getElementById('sa-progress').style.display = 'none';
    document.getElementById('sa-error').textContent = '연결 오류: 서버와 통신 중 문제가 발생했습니다.';
    document.getElementById('sa-error').style.display = 'block';
  };
}

/* ── 결과 렌더링 ─────────────────────────────────────────── */
function fmt(n, suffix='') {
  if (n === null || n === undefined) return '—';
  if (typeof n === 'number') return n.toLocaleString('ko-KR') + suffix;
  return n;
}

function renderResult(d) {
  const ta  = d['기술적분석']  || {};
  const val = d['밸류에이션']  || {};
  const fin = d['재무제표_3개년'] || {};

  document.getElementById('r-name').textContent = d['종목명'] || '—';
  document.getElementById('r-code').textContent = '(' + (d['종목코드'] || '') + ')';
  document.getElementById('r-date').textContent =
    '기준일: ' + (ta['기준일'] || '—') + '  ·  수집: ' + (d['수집시각'] || '—');

  const price  = ta['현재가'];
  const chgPct = ta['전일대비_pct'];
  document.getElementById('r-price').textContent = price
    ? price.toLocaleString('ko-KR') + '원' : '—';

  const chgEl = document.getElementById('r-change');
  if (chgPct !== undefined) {
    const cls = chgPct > 0 ? 'sa-change-pos' : chgPct < 0 ? 'sa-change-neg' : 'sa-change-neu';
    chgEl.className = cls;
    chgEl.textContent = (chgPct >= 0 ? '+' : '') + chgPct.toFixed(2) + '%';
  }

  const alignEl = document.getElementById('r-align-badge');
  if (ta['정배열_여부'] === true) {
    alignEl.innerHTML = '<span class="sa-badge sa-badge-green">정배열</span>';
  } else if (ta['정배열_여부'] === false) {
    alignEl.innerHTML = '<span class="sa-badge sa-badge-red">역배열</span>';
  } else { alignEl.innerHTML = ''; }

  const rsiCls   = ta['RSI_상태'] === '과매수' ? 'sa-change-pos' : ta['RSI_상태'] === '과매도' ? 'sa-change-neg' : '';
  const cross    = ta['20_60_크로스'];
  const crossLbl = cross === 'golden_cross' ? '🟢 골든크로스' : cross === 'dead_cross' ? '🔴 데드크로스' : '없음';

  document.getElementById('r-technicals').innerHTML = `
    <div class="sa-indicator-row"><span class="sa-indicator-label">52주 고가</span><span class="sa-indicator-val">${fmt(ta['52주_고가'])}원</span></div>
    <div class="sa-indicator-row"><span class="sa-indicator-label">52주 저가</span><span class="sa-indicator-val">${fmt(ta['52주_저가'])}원</span></div>
    <div class="sa-indicator-row"><span class="sa-indicator-label">RSI(14)</span><span class="sa-indicator-val"><span class="${rsiCls}">${fmt(ta['RSI14'])} · ${ta['RSI_상태'] || '—'}</span></span></div>
    <div class="sa-indicator-row"><span class="sa-indicator-label">MACD</span><span class="sa-indicator-val">${fmt(ta['MACD'])} (시그널: ${fmt(ta['MACD_signal'])})</span></div>
    <div class="sa-indicator-row"><span class="sa-indicator-label">MACD 방향</span><span class="sa-indicator-val">${ta['MACD_방향'] || '—'}</span></div>
    <div class="sa-indicator-row"><span class="sa-indicator-label">20·60 크로스</span><span class="sa-indicator-val">${crossLbl}</span></div>`;

  const maData = ta['이동평균선'] || {};
  document.getElementById('r-ma').innerHTML = ['MA5','MA20','MA60','MA120'].map(k => {
    const v    = maData[k];
    const diff = (v && price) ? ((price / v - 1) * 100) : null;
    const ds   = diff !== null
      ? (diff >= 0
          ? `<span class="sa-change-pos">+${diff.toFixed(1)}%</span>`
          : `<span class="sa-change-neg">${diff.toFixed(1)}%</span>`)
      : '';
    return `<div class="sa-mini-card">
      <div class="sa-mini-label">${k}</div>
      <div class="sa-mini-val">${v ? v.toLocaleString('ko-KR') : '—'}원</div>
      <div class="sa-mini-sub">현재가 대비 ${ds}</div>
    </div>`;
  }).join('');

  if (val.error) {
    document.getElementById('r-valuation').innerHTML =
      `<div class="text-muted" style="font-size:.82rem">${val.error}</div>`;
  } else {
    document.getElementById('r-valuation').innerHTML = `
      <div class="sa-mini-card"><div class="sa-mini-label">PER</div><div class="sa-mini-val">${fmt(val['PER'])}배</div></div>
      <div class="sa-mini-card"><div class="sa-mini-label">PBR</div><div class="sa-mini-val">${fmt(val['PBR'])}배</div></div>
      <div class="sa-mini-card"><div class="sa-mini-label">EPS</div><div class="sa-mini-val">${fmt(val['EPS'])}원</div></div>
      <div class="sa-mini-card"><div class="sa-mini-label">배당수익률</div><div class="sa-mini-val">${fmt(val['DIV_배당수익률'])}%</div></div>
      <div class="sa-mini-card"><div class="sa-mini-label">시가총액</div><div class="sa-mini-val">${fmt(val['시가총액_억원'])}억원</div></div>
      <div class="sa-mini-card"><div class="sa-mini-label">BPS</div><div class="sa-mini-val">${fmt(val['BPS'])}원</div></div>
      <div class="sa-mini-card"><div class="sa-mini-label">상장주식수</div><div class="sa-mini-val" style="font-size:.9rem">${fmt(val['상장주식수'])}주</div></div>`;
  }

  const years = Object.keys(fin).sort().reverse();
  if (fin.error || years.length === 0) {
    document.getElementById('r-financials').innerHTML =
      `<div class="text-muted" style="font-size:.82rem">${fin.error || '재무 데이터 없음'}</div>`;
  } else {
    const rows = [
      ['매출액 (백만원)',       '매출액',          1e6,  ''],
      ['영업이익 (백만원)',     '영업이익',        1e6,  ''],
      ['당기순이익 (백만원)',   '당기순이익',      1e6,  ''],
      ['영업이익률',            '영업이익률_pct',  null, '%'],
      ['ROE',                   'ROE_pct',         null, '%'],
      ['부채비율',              '부채비율_pct',    null, '%'],
      ['자산총계 (백만원)',     '자산총계',        1e6,  ''],
      ['자본총계 (백만원)',     '자본총계',        1e6,  ''],
      ['영업활동현금흐름 (백만원)', '영업활동현금흐름', 1e6, ''],
    ];
    const hdr  = `<tr><th>항목</th>${years.map(y=>`<th>${y}</th>`).join('')}</tr>`;
    const body = rows.map(([lbl, key, div, sfx]) => {
      const cells = years.map(y => {
        const v = fin[y]?.[key];
        if (v === undefined || v === null) return '<td class="mono text-muted">—</td>';
        const disp = div ? Math.round(v / div).toLocaleString('ko-KR') : v.toLocaleString('ko-KR');
        return `<td class="mono">${disp}${sfx}</td>`;
      }).join('');
      return `<tr><td style="font-size:.8rem;color:var(--text-muted)">${lbl}</td>${cells}</tr>`;
    }).join('');
    document.getElementById('r-financials').innerHTML =
      `<table><thead>${hdr}</thead><tbody>${body}</tbody></table>`;
  }

  const chart = ta['차트_6개월'] || [];
  if (chart.length) {
    const dates  = chart.map(c => c.date);
    const closes = chart.map(c => c.close);
    Plotly.newPlot('sa-chart',
      [{ x: dates, y: closes, type: 'scatter', mode: 'lines',
         line: { color: '#5c9aff', width: 2 },
         fill: 'tozeroy', fillcolor: 'rgba(92,154,255,0.08)', name: '종가' }],
      { paper_bgcolor: 'transparent', plot_bgcolor: 'transparent',
        font: { color: '#aaa', size: 11 },
        xaxis: { gridcolor: '#2a2a2a', tickfont: { size: 10 } },
        yaxis: { gridcolor: '#2a2a2a', tickformat: ',d', tickfont: { size: 10 } },
        margin: { l: 55, r: 10, t: 10, b: 40 }, showlegend: false },
      { responsive: true, displayModeBar: false }
    );
  }

  document.getElementById('sa-result').style.display = 'block';
  document.getElementById('sa-result').scrollIntoView({ behavior: 'smooth' });
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('sa-input').focus();
});
</script>
{% endblock %}
