{% extends "base.html" %}
{% block extra_head %}
<link rel="stylesheet" href="/static/css/stock-analysis.css?v={{ static_ver }}">
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
{% endblock %}
{% block content %}

<div class="sa-search-bar">
  <input type="text" id="sa-input"
         placeholder="종목명 또는 종목코드 (예: 삼성전자, 005930)"
         autocomplete="off"
         onkeydown="if(event.key==='Enter') runAnalysis()">
  <button class="topbar-btn" id="sa-btn" onclick="runAnalysis()">▶ 분석</button>
</div>

{% include "_stock_analysis_panel.html" %}

{% endblock %}
{% block extra_scripts %}
<script src="/static/js/stock-analysis.js?v={{ static_ver }}"></script>
<script>
/* 단독 화면 진입점 — 검색창 값으로 공유 딥다이브 실행 */
function runAnalysis() {
  const ticker = document.getElementById('sa-input').value.trim();
  if (!ticker) { alert('종목명 또는 종목코드를 입력하세요.'); return; }
  runStockAnalysis(ticker);
}
</script>
{% endblock %}
