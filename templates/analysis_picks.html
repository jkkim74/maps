{% extends "base.html" %}
{% block extra_head %}
<link rel="stylesheet" href="/static/css/stock-analysis.css?v={{ static_ver }}">
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
.ap-link{cursor:pointer;color:var(--text-primary)}
.ap-link:hover{color:var(--accent);text-decoration:underline}
.ap-form{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;
  padding:16px 20px;margin-bottom:20px;display:none}
.ap-form.open{display:block}
.ap-form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.ap-form label{display:block;font-size:.72rem;color:var(--text-muted);margin-bottom:4px}
.ap-form input,.ap-form select{width:100%;padding:7px 10px;border:1px solid var(--border);
  border-radius:6px;background:var(--bg);color:var(--text-primary);font-size:.85rem}
.ap-num{text-align:right;font-variant-numeric:tabular-nums}
/* 기준일 만료 행 — 가격이 유효한 계획처럼 읽히지 않게 눌러 둔다. 이 페이지 전용이라
   전역 CSS 에 클래스를 만들지 않는다. */
tr.ap-stale td{opacity:.55}
tr.ap-stale td:first-child,tr.ap-stale td:nth-child(3){opacity:1}
.topbar-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
</style>
{% endblock %}
{% block topbar_actions %}
<button class="topbar-btn" onclick="toggleAddForm()">＋ 수동 추가</button>
{% endblock %}
{% block content %}

<!-- ── 수동 추가 폼 ── -->
<div id="ap-form" class="ap-form">
  <div class="ap-form-grid">
    <div><label>종목코드 *</label><input id="f-ticker" placeholder="005930"></div>
    <div><label>종목명</label><input id="f-name" placeholder="삼성전자"></div>
    <div><label>시장</label>
      <select id="f-market"><option value="">—</option><option>KOSPI</option><option>KOSDAQ</option></select>
    </div>
    <div><label>기준일</label><input id="f-refdate" type="date"></div>
    <div><label>매수가</label><input id="f-buy" class="ap-num" type="number" step="any"></div>
    <div><label>목표가</label><input id="f-target" class="ap-num" type="number" step="any"></div>
    <div><label>손절가</label><input id="f-stop" class="ap-num" type="number" step="any"></div>
    <div><label>수량</label><input id="f-qty" class="ap-num" type="number" step="1"></div>
  </div>
  <div style="margin-bottom:12px"><label style="font-size:.72rem;color:var(--text-muted)">메모</label>
    <input id="f-rationale" placeholder="분석 근거 / 메모"></div>
  <button class="topbar-btn" onclick="submitPick()">저장</button>
  <span id="ap-form-msg" style="margin-left:10px;font-size:.8rem;color:var(--text-muted)"></span>
</div>

<div class="section-header"><span class="section-title">분석 워치리스트</span><hr></div>
<div style="display:flex;gap:6px;margin-bottom:10px">
  <button id="ap-tab-active" class="topbar-btn" onclick="setMode('active')">워치리스트</button>
  <button id="ap-tab-closed" class="topbar-btn" onclick="setMode('closed')">완료(익절/손절)</button>
</div>
<div class="card"><div class="card-body" id="ap-list">
  <div class="loading"><div class="spinner"></div></div>
</div></div>

{% include "_stock_analysis_modal.html" %}

{% endblock %}
{% block extra_scripts %}
<script src="/static/js/stock-analysis.js?v={{ static_ver }}"></script>
<script>
function toggleAddForm() {
  document.getElementById('ap-form').classList.toggle('open');
}

function fmtPrice(n) {
  return (n === null || n === undefined) ? '—' : Number(n).toLocaleString('ko-KR') + '원';
}
function toKST(isoStr) {
  if (!isoStr) return '—';
  const s = isoStr.includes('Z') || isoStr.includes('+') ? isoStr : isoStr + 'Z';
  return new Date(s).toLocaleString('sv-SE', { timeZone: 'Asia/Seoul' }).slice(0, 16).replace('T', ' ');
}
function stateBadge(p) {
  const map = { WATCH:['관찰','info'], ARMED:['대기','warn'], BOUGHT:['보유','pass'],
                CLOSED:['종료','info'], CANCELLED:['취소','fail'] };
  const [label, cls] = map[p.state] || [p.state, 'info'];
  let extra = '';
  if (p.state === 'CLOSED' && p.exit_reason) {
    const [rl, rc] = p.exit_reason === 'take_profit' ? ['익절','pass'] : ['손절','fail'];
    extra = ` <span class="badge badge-${rc}">${rl}</span>`;
  }
  // 기준일 만료 — 날짜 계산은 서버가 끝냈고 여기선 라벨만 붙인다.
  if (p.data_stale) {
    const age = p.age_trading_days != null ? `${p.age_trading_days}거래일` : '';
    extra += ` <span class="badge badge-alert" title="분석 기준일이 오래돼 무장할 수 없습니다">만료 ${age}</span>`;
  }
  return `<span class="badge badge-${cls}">${label}</span>${extra}`;
}
function esc(s) {
  // JS 문자열 리터럴용 이스케이프 (onclick 인자)
  return (s == null ? '' : String(s)).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
}
function escHtml(s) {
  // HTML 텍스트/속성용 이스케이프 (innerHTML 주입 — 저장형 XSS 방지)
  return (s == null ? '' : String(s)).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

let apMode = 'active';
function setMode(m) {
  apMode = m;
  document.getElementById('ap-tab-active').classList.toggle('active', m === 'active');
  document.getElementById('ap-tab-closed').classList.toggle('active', m === 'closed');
  loadPicks();
}

async function loadPicks() {
  const box = document.getElementById('ap-list');
  const closed = apMode === 'closed';
  try {
    const url = closed ? '/api/v1/analysis-picks?state=CLOSED' : '/api/v1/analysis-picks';
    const d = await fetch(url).then(r => r.json());
    if (!d.picks || d.picks.length === 0) {
      const msg = closed ? '완료(익절/손절)된 종목이 없습니다.'
                         : '워치리스트가 비어 있습니다 — ＋ 수동 추가 또는 /analyze 결과 적재';
      box.innerHTML = '<div class="empty-state"><div class="empty-icon">○</div>' +
        `<div class="empty-text">${msg}</div></div>`;
      return;
    }
    const rows = d.picks.map(p => `
      <tr${p.data_stale ? ' class="ap-stale"' : ''}>
        <td><span class="ap-link" onclick="openStockAnalysisModal('${esc(p.ticker)}')">
          ${escHtml(p.name || p.ticker)}<br><span class="mono text-muted" style="font-size:.75rem">${escHtml(p.ticker)}</span>
        </span></td>
        <td class="text-muted">${escHtml(p.market || '—')}</td>
        <td class="mono text-muted" style="font-size:.75rem">${escHtml(p.ref_date || '—')}</td>
        <td class="ap-num mono">${fmtPrice(p.current_price)}</td>
        <td>${planCell(p)}</td>
        <td class="ap-num mono">${fmtPrice(p.fill_price)}</td>
        <td class="ap-num mono">${fmtPrice(p.target_price)}</td>
        <td class="ap-num mono">${fmtPrice(p.stop_price)}</td>
        <td class="ap-num mono">${p.rr_ratio != null ? p.rr_ratio.toFixed(2) : '—'}</td>
        <td title="${[p.entry_order_id ? 'entry=' + p.entry_order_id : '', p.exit_order_id ? 'exit=' + p.exit_order_id : ''].filter(Boolean).join(' ')}">${stateBadge(p)}</td>
        <td style="text-align:center">${bracketCell(p)}</td>
        <td class="text-muted" style="font-size:.75rem">${escHtml(p.source)}</td>
        <td class="mono text-muted" style="font-size:.75rem">${toKST(p.created_at)}</td>
        <td><button class="topbar-btn" style="font-size:.72rem" onclick="deletePick(${p.id})">삭제</button></td>
      </tr>
      <tr id="ap-leg-detail-${p.id}" style="display:none"><td colspan="14">${legDetail(p)}</td></tr>`).join('');
    const staleNote = d.stale_count > 0
      ? `<div class="text-muted" style="font-size:.78rem;margin-bottom:.5rem">
           기준일 ${escHtml(d.expected_ref_date || '')} 이전 픽 <b>${d.stale_count}건</b>이 만료 상태입니다 — 무장할 수 없습니다. 재분석 후 가격을 갱신하세요.
         </div>`
      : '';
    box.innerHTML = staleNote + `
      <table>
        <thead><tr>
          <th>종목</th><th>시장</th><th>기준일</th><th class="ap-num">현재가</th>
          <th>진입계획</th><th class="ap-num">체결가</th><th class="ap-num">목표가</th><th class="ap-num">손절가</th>
          <th class="ap-num">손익비</th><th>상태</th>
          <th style="text-align:center">브래킷</th><th>소스</th><th>생성</th><th></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  } catch (e) {
    box.innerHTML = `<div class="empty-state"><div class="empty-text">오류: ${e.message}</div></div>`;
  }
}

async function submitPick() {
  const ticker = document.getElementById('f-ticker').value.trim();
  const msg = document.getElementById('ap-form-msg');
  if (!ticker) { msg.textContent = '종목코드를 입력하세요.'; return; }
  const numOrNull = id => {
    const v = document.getElementById(id).value.trim();
    return v === '' ? null : Number(v);
  };
  const pick = {
    ticker,
    name: document.getElementById('f-name').value.trim() || null,
    market: document.getElementById('f-market').value || null,
    source: 'manual',
    ref_date: document.getElementById('f-refdate').value || null,
    buy_price: numOrNull('f-buy'),
    target_price: numOrNull('f-target'),
    stop_price: numOrNull('f-stop'),
    qty: numOrNull('f-qty'),
    rationale: document.getElementById('f-rationale').value.trim() || null,
  };
  try {
    const res = await fetch('/api/v1/analysis-picks', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ picks: [pick] }),
    });
    if (!res.ok) { msg.textContent = '저장 실패: ' + (await res.text()); return; }
    msg.textContent = '';
    ['f-ticker','f-name','f-buy','f-target','f-stop','f-qty','f-rationale'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('ap-form').classList.remove('open');
    loadPicks();
  } catch (e) {
    msg.textContent = '오류: ' + e.message;
  }
}

function bracketCell(p) {
  if (p.trade_mode === 'split' && (p.state === 'ARMED' || p.state === 'BOUGHT')) {
    if (p.entries_cancelled)
      return `<span class="text-muted" style="font-size:.72rem">추가매수 중지 · 청산감시</span>`;
    return `<button class="topbar-btn" style="font-size:.72rem" onclick="stopSplitEntries(${p.id})">분할 매수 중단</button>`;
  }
  if (p.state === 'WATCH' || p.state === 'CANCELLED') {
    // 진짜 가드는 서버의 409다. 여기서 끄는 건 헛된 왕복을 줄이기 위한 것뿐이다.
    if (p.data_stale)
      return `<button class="topbar-btn" style="font-size:.72rem" disabled title="기준일 ${p.ref_date} — 만료되어 무장할 수 없습니다">무장</button>`;
    return `<button class="topbar-btn" style="font-size:.72rem" onclick="armPick(${p.id})">무장</button>`;
  }
  if (p.state === 'ARMED')
    return `<button class="topbar-btn" style="font-size:.72rem" onclick="disarmPick(${p.id})">해제</button>`;
  if (p.state === 'BOUGHT')
    return `<span class="text-muted" style="font-size:.72rem">보유중</span>`;
  return '—';
}

function planCell(p) {
  if (p.trade_mode !== 'split') {
    return `<span class="badge badge-info">단일</span><br><span class="mono">${fmtPrice(p.buy_price)}</span>`;
  }
  const next = p.next_entry_price != null ? fmtPrice(p.next_entry_price) : '없음';
  return `<button class="topbar-btn" style="font-size:.7rem" onclick="toggleLegDetail(${p.id})">3분할 상세</button>
    <div class="mono" style="font-size:.72rem;margin-top:4px">${p.filled_legs}/${p.total_legs}회 완료 · 다음 ${next}</div>
    <div class="text-muted" style="font-size:.7rem">계획 ${p.total_budget != null ? fmtPrice(p.total_budget) : '—'}</div>`;
}

function legDetail(p) {
  if (p.trade_mode !== 'split' || !p.legs?.length) return '';
  const rows = p.legs.map(leg => `<tr>
    <td>${leg.sequence}차</td><td>${fmtPrice(leg.entry_price)}</td><td>${leg.weight_pct}%</td>
    <td>${leg.planned_qty}주</td><td>${leg.filled_qty}주</td><td>${leg.remaining_qty}주</td>
    <td>${fmtPrice(leg.fill_price)}</td><td>${escHtml(leg.status)}</td></tr>`).join('');
  return `<div style="padding:10px 18px;background:var(--bg-hover);border-radius:8px">
    <div style="font-size:.78rem;margin-bottom:8px">공통 목표 ${fmtPrice(p.target_price)} · 손절 ${fmtPrice(p.stop_price)}
      ${p.entries_cancelled ? ' · 추가매수 중지, 보유분 청산 감시 유지' : ''}</div>
    <table><thead><tr><th>회차</th><th>진입가</th><th>비중</th><th>planned_qty</th>
      <th>filled_qty</th><th>remaining_qty</th><th>체결가</th><th>상태</th></tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}

function toggleLegDetail(id) {
  const row = document.getElementById(`ap-leg-detail-${id}`);
  if (row) row.style.display = row.style.display === 'none' ? 'table-row' : 'none';
}

async function stopSplitEntries(id) {
  if (!confirm('미체결 분할매수를 중단할까요? 보유분 목표·손절 감시는 계속됩니다.')) return;
  const res = await fetch(`/api/v1/analysis-picks/${id}/stop-entries`, { method: 'POST' });
  if (!res.ok) { alert('분할 매수 중단 실패: ' + (await res.text())); return; }
  loadPicks();
}

async function armPick(id) {
  const res = await fetch(`/api/v1/analysis-picks/${id}/arm`, { method: 'POST' });
  if (!res.ok) { alert('무장 실패: ' + (await res.text())); return; }
  loadPicks();
}

async function disarmPick(id) {
  if (!confirm('무장을 해제할까요?')) return;
  const res = await fetch(`/api/v1/analysis-picks/${id}/disarm`, { method: 'POST' });
  if (!res.ok) { alert('해제 실패: ' + (await res.text())); return; }
  loadPicks();
}

async function deletePick(id) {
  if (!confirm('이 픽을 삭제할까요?')) return;
  await fetch(`/api/v1/analysis-picks/${id}`, { method: 'DELETE' });
  loadPicks();
}

document.addEventListener('DOMContentLoaded', () => setMode('active'));
</script>
{% endblock %}
