{% extends "base.html" %}
{% block topbar_actions %}
<select id="preset-select" class="topbar-btn" onchange="changePreset(this.value)">
  <option value="balanced">Balanced</option>
  <option value="conservative">Conservative</option>
  <option value="growth">Growth</option>
</select>
{% endblock %}
{% block content %}
<div id="robustness-kpi"><div class="loading"><div class="spinner"></div></div></div>

<div class="section-header"><span class="section-title">Tradeability 서브스코어 분해</span><hr></div>
<div id="breakdown-area"><div class="loading"><div class="spinner"></div></div></div>

<div class="section-header"><span class="section-title">Parameter Plateau</span><hr></div>
<div class="card"><div class="card-body" id="plateau-area">
  <div class="loading"><div class="spinner"></div></div>
</div></div>

<div class="section-header"><span class="section-title">MC MDD 분포</span><hr></div>
<div class="card"><div class="card-body" id="mc-area">
  <div class="loading"><div class="spinner"></div></div>
</div></div>
{% endblock %}
{% block extra_scripts %}
<script>
function changePreset(p) {
  const url = new URL(location.href);
  url.searchParams.set('preset', p);
  location.href = url.toString();
}
document.addEventListener('DOMContentLoaded', () => {
  const p = new URLSearchParams(location.search).get('preset') || 'balanced';
  document.getElementById('preset-select').value = p;
});
</script>
{% endblock %}
