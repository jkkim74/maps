<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAPS 종목 분석–전략매매 화면설계 프로토타입</title>
  <style>
    :root {
      --bg:#070d17; --shell:#0b1423; --panel:#101d30; --panel2:#0c1727;
      --line:#263951; --text:#e7eef8; --muted:#91a4bd; --blue:#3b82f6;
      --green:#22c55e; --orange:#f59e0b; --red:#ef4444; --violet:#8b5cf6;
    }
    *{box-sizing:border-box} body{margin:0;background:#dfe7f1;color:#172033;font-family:"Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif}
    button,input,select{font:inherit}.prototype-toolbar{height:58px;background:#fff;border-bottom:1px solid #cbd5e1;display:flex;align-items:center;gap:10px;padding:8px 18px;position:sticky;top:0;z-index:20}
    .prototype-toolbar strong{margin-right:8px}.prototype-toolbar select,.prototype-toolbar button{height:36px;border:1px solid #b8c5d5;border-radius:6px;background:#fff;padding:0 10px}
    .prototype-toolbar button{cursor:pointer}.prototype-toolbar .notice{margin-left:auto;font-size:12px;color:#b91c1c;font-weight:700}
    .app-frame{width:min(1440px,calc(100vw - 28px));height:calc(100vh - 82px);min-height:720px;margin:12px auto;background:var(--shell);border:1px solid #25364d;border-radius:12px;overflow:hidden;box-shadow:0 18px 45px rgba(15,23,42,.25);color:var(--text)}
    .app-top{height:50px;background:#0d1829;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:24px}
    .brand{font-weight:900;color:#67a8ff;letter-spacing:.12em}.app-title{font-size:13px;font-weight:700}.account-badge{margin-left:auto;font-size:11px;background:#33270c;color:#fbbf24;border:1px solid #6b531a;border-radius:13px;padding:5px 9px}
    .app-grid{display:grid;grid-template-columns:170px minmax(0,1fr) 330px;height:calc(100% - 50px)}
    .sidebar{background:#091322;border-right:1px solid var(--line);padding:14px 10px}.nav{padding:10px;border-radius:6px;color:#8da1ba;font-size:12px;margin-bottom:4px}.nav.active{background:#17335e;color:#fff;font-weight:700}.nav-sub{margin-top:24px;padding:9px;color:#71859e;font-size:10px;border-top:1px solid #1f3046}
    .workspace{padding:16px 18px;overflow:auto;position:relative}.breadcrumb{font-size:10px;color:#7488a0;margin-bottom:8px}.heading{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}.heading h1{font-size:20px;margin:0 0 4px}.heading p{font-size:11px;color:var(--muted);margin:0}.status{font-size:10px;border-radius:12px;padding:5px 9px;background:#123f2c;color:#86efac;border:1px solid #236441}
    .card{background:var(--panel);border:1px solid #2b3e57;border-radius:9px;padding:13px;margin-bottom:10px;position:relative}.card-title{font-size:12px;font-weight:800;margin-bottom:9px}.card-sub{font-size:10px;color:var(--muted)}
    .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
    .metric{background:#0a1524;border-radius:7px;padding:9px;border:1px solid #20334b}.metric span{display:block;font-size:9px;color:#8095ae}.metric b{display:block;font-size:13px;margin-top:4px}.metric.good b{color:#86efac}.metric.warn b{color:#fbbf24}
    .btn{border:1px solid #39516f;background:#0b1728;color:#dbe8f8;border-radius:7px;padding:8px 12px;cursor:pointer}.btn:hover{border-color:#64a2f4}.btn.primary{background:#2563eb;border-color:#4f91ed;color:#fff;font-weight:800}.btn.danger{background:#7f1d1d;border-color:#ef4444}.btn.success{background:#14532d;border-color:#22c55e}.btn:disabled{background:#293649;border-color:#415168;color:#8192a8;cursor:not-allowed}.action-row{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:10px}
    .seg{display:flex;gap:8px}.seg button{flex:1;padding:12px}.seg .on{background:#1759a8;color:#fff;border-color:#60a5fa}
    label{display:block;font-size:9px;color:#8ea1b8;margin-bottom:4px}.field input,.field select{width:100%;height:34px;background:#07111e;border:1px solid #3a516f;border-radius:6px;color:#fff;padding:0 8px}.field input:focus{outline:2px solid #2563eb}
    table{width:100%;border-collapse:collapse;font-size:10px}th{text-align:left;color:#8297af;padding:6px;border-bottom:1px solid #2a3c53}td{padding:7px 6px;border-bottom:1px solid #23364e}td input{width:84px;background:#07111e;color:#fff;border:1px solid #3a516e;border-radius:4px;padding:5px}.mono{font-variant-numeric:tabular-nums;font-family:Consolas,monospace}
    .pill{display:inline-block;border-radius:12px;padding:4px 7px;font-size:9px}.pill.blue{background:#173b70;color:#93c5fd}.pill.green{background:#123f2c;color:#86efac}.pill.orange{background:#4a350b;color:#fcd34d}.pill.red{background:#4c1515;color:#fca5a5}.pill.gray{background:#253347;color:#b6c4d4}
    .chart{height:145px;border-radius:7px;background:linear-gradient(180deg,rgba(37,99,235,.22),rgba(15,23,42,.2)),linear-gradient(135deg,transparent 0 15%,#4388e8 16% 17%,transparent 18% 32%,#4388e8 33% 34%,transparent 35% 52%,#4388e8 53% 54%,transparent 55% 70%,#4388e8 71% 72%,transparent 73%);border:1px solid #253a55;position:relative}.chart:after{content:"6개월 가격 흐름 · 예시";position:absolute;left:10px;bottom:8px;font-size:9px;color:#8ea1b8}
    .ai-copy{font-size:10px;line-height:1.65;color:#cbd8e8}.price-plan{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}.price-plan div{background:#0a1524;border-radius:6px;padding:7px;text-align:center}.price-plan small{display:block;color:#8498b0}.price-plan b{font-size:11px}
    .callout{border-left:3px solid var(--blue);background:#0a1728;border-radius:5px;padding:8px 10px;font-size:10px;color:#c8d6e8}.callout.warn{border-color:var(--orange);background:#2a210e}.callout.error{border-color:var(--red);background:#2e1215}.callout.good{border-color:var(--green);background:#0e281d}
    .annotation{background:#f8fafc;color:#172033;border-left:1px solid #cbd5e1;padding:13px;overflow:auto}.annotation h2{font-size:14px;margin:0 0 5px}.annotation .screen-desc{font-size:10px;color:#64748b;margin-bottom:10px}.lane{border-radius:8px;padding:9px;margin-bottom:9px}.lane.user{background:#e8f1ff;border:1px solid #9dc5ff}.lane.system{background:#e9f9ef;border:1px solid #8ed5a6}.lane h3{font-size:11px;margin:0 0 6px}.lane ol{margin:0;padding-left:20px;font-size:10px;line-height:1.58}.result-box{background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:9px;font-size:10px;line-height:1.5}.legend{display:flex;gap:10px;font-size:9px;color:#64748b;margin-bottom:9px}
    .dot,.marker{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-weight:900;color:#fff}.dot{width:19px;height:19px;margin-right:4px}.marker{position:absolute;width:24px;height:24px;font-size:9px;z-index:4;box-shadow:0 2px 6px rgba(0,0,0,.45)}.dot.user,.marker.user{background:#2563eb;border:2px solid #93c5fd}.dot.system,.marker.system{background:#16a34a;border:2px solid #86efac}.pin{position:relative}.pin>.marker{right:-10px;top:-10px}
    .journey{display:flex;align-items:stretch;gap:8px;margin-top:25px}.journey-step{flex:1;background:#0a1728;border:1px solid #2a405c;border-radius:8px;padding:12px;position:relative}.journey-step b{font-size:12px}.journey-step p{font-size:9px;color:#90a4bc;line-height:1.55}.journey-arrow{align-self:center;color:#5799ed;font-weight:900}.dual-lane{margin-top:16px}.flow-row{display:grid;grid-template-columns:90px repeat(5,1fr);gap:6px;margin-bottom:7px}.flow-label{border-radius:6px;padding:10px;font-size:10px;font-weight:800}.flow-label.u{background:#173b70}.flow-label.s{background:#14532d}.flow-cell{border:1px solid #2d425e;border-radius:6px;padding:8px;font-size:9px;text-align:center;background:#0b1728}.flow-cell.s{background:#0e281d}
    .compare{display:grid;grid-template-columns:1fr 60px 1fr;gap:12px;align-items:center}.compare-box{min-height:280px;border-radius:9px;padding:14px}.compare-box.old{background:#28191b;border:1px solid #6c2c31}.compare-box.new{background:#10271d;border:1px solid #276241}.compare h2{text-align:center;color:#67a8ff}.compare ul{font-size:10px;line-height:1.8;padding-left:18px}.center-arrow{text-align:center;color:#67a8ff;font-size:30px}
    .progress{display:flex;gap:5px;margin:10px 0}.progress span{height:6px;flex:1;border-radius:4px;background:#293a50}.progress .done{background:#22c55e}.progress .active{background:#3b82f6}.mobile-shell{width:300px;height:520px;border:7px solid #27364a;border-radius:27px;background:#08111f;margin:0 auto;padding:16px;box-shadow:0 16px 30px rgba(0,0,0,.3)}.mobile-head{display:flex;justify-content:space-between;font-size:11px;margin-bottom:18px}.mobile-card{background:#101d30;border:1px solid #2a3e58;border-radius:10px;padding:12px;margin-bottom:10px;font-size:10px}.mobile-card b{font-size:13px}.state-flow{display:flex;align-items:center;justify-content:center;gap:10px;margin:35px 0}.state-node{background:#13243a;border:1px solid #3a5576;border-radius:9px;padding:16px 24px;text-align:center}.checklist{columns:2;column-gap:30px;font-size:10px;line-height:1.85}
    @media(max-width:1050px){.app-grid{grid-template-columns:140px 1fr}.annotation{display:none}.prototype-toolbar .notice{display:none}}
    body.capture{background:#07101d;overflow:hidden}.capture .prototype-toolbar,.capture .annotation{display:none}.capture .app-frame{width:1100px;height:720px;min-height:720px;margin:10px}.capture .app-grid{grid-template-columns:160px 1fr}.capture .workspace{overflow:hidden}.capture .app-top{height:48px}.capture .app-grid{height:672px}
  </style>
</head>
<body>
  <header class="prototype-toolbar">
    <strong>MAPS 화면설계 프로토타입</strong>
    <label for="screenSelect" style="margin:0;color:#475569">화면</label><select id="screenSelect"></select>
    <label for="scenarioSelect" style="margin:0;color:#475569">시나리오</label>
    <select id="scenarioSelect"><option value="normal">정상 BUY</option><option value="ai-fail">AI 실패·관망</option><option value="cash">현금 부족</option><option value="duplicate">중복 종목</option><option value="gate-off">자동매매 비활성</option><option value="partial">부분체결</option></select>
    <button type="button" id="prevBtn">이전</button><button type="button" id="nextBtn">다음</button>
    <span class="notice">예시 데이터 · 실제 주문이 발생하지 않습니다</span>
  </header>
  <div class="app-frame">
    <div class="app-top"><span class="brand">MAPS</span><span class="app-title" id="topTitle">주식 종목 분석</span><span class="account-badge" id="accountBadge">KIS PAPER · 자동매매 준비완료</span></div>
    <div class="app-grid">
      <nav class="sidebar"><div class="nav">대시보드</div><div class="nav active">주식 종목 분석</div><div class="nav">분석 워치리스트</div><div class="nav">주문·체결</div><div class="nav">리스크 모니터</div><div class="nav-sub">SCREEN DESIGN v1.0<br>네트워크 호출 없음</div></nav>
      <main class="workspace" id="workspace"></main>
      <aside class="annotation">
        <div class="legend"><span><span class="dot user">U</span>사용자</span><span><span class="dot system">S</span>시스템</span></div>
        <h2 id="annotationTitle"></h2><div class="screen-desc" id="annotationDesc"></div>
        <section class="lane user"><h3>사용자가 하는 일</h3><ol id="userActions"></ol></section>
        <section class="lane system"><h3>시스템이 해주는 일</h3><ol id="systemActions"></ol></section>
        <section class="result-box"><b>처리 결과</b><div id="screenResult"></div></section>
      </aside>
    </div>
  </div>
  <script>
    "use strict";
    const SCREEN_ORDER=["journey","asis","analysis-input","analysis-result","ai-fallback","trade-mode","single-setup","split-setup","safe-budget","validation","confirm","armed","watchlist","leg-detail","mobile","state-flow"];
    const META={
      "journey":{title:"전체 사용자 여정",desc:"사용자의 결정과 시스템 자동 처리를 두 개의 흐름으로 구분합니다.",u:["종목을 선택해 분석을 시작한다.","단일 또는 분할매매를 결정한다.","가격·금액·위험을 확인한 뒤 실행한다."],s:["기술·재무·AI 분석을 수행한다.","주문가능금액과 회차별 수량을 계산한다.","ARMED 등록 후 현재가를 감시하고 주문한다."],r:"분석 → 설정 → 무장 → 순차매수 → 전체청산의 책임이 명확해집니다."},
      "asis":{title:"AS-IS와 TO-BE",desc:"현재 메뉴의 단절점과 새 화면의 연결 방식을 비교합니다.",u:["기존에는 AI 문장을 보고 값을 따로 옮겼다.","새 화면에서는 제안값을 검토하고 승인한다."],s:["기존에는 분석과 주문 입력이 분리되어 있었다.","새 화면에서는 구조화 전략과 워치 등록을 연결한다."],r:"수작업 복사 없이 분석 근거가 워치 전략으로 이어집니다."},
      "analysis-input":{title:"종목 검색과 분석 실행",desc:"분석의 시작 화면입니다.",u:["종목명 또는 6자리 코드를 입력한다.","분석 실행 버튼을 누른다."],s:["종목코드를 확인한다.","기술지표·밸류에이션·재무·AI 분석을 순서대로 수행한다."],r:"분석 결과 화면으로 이동합니다."},
      "analysis-result":{title:"분석 결과와 AI 전략",desc:"분석 내용을 이해한 뒤 매매 설정으로 진입합니다.",u:["가격·기술·재무·AI 의견을 검토한다.","매수가 필요하면 ‘매매 설정’을 누른다."],s:["AI 설명과 별도로 주문용 숫자 전략을 생성한다.","BUY/WATCH/SELL과 가격 정합성을 검증한다."],r:"BUY이면 자동값을 제공하고, 관망·실패면 수동 입력으로 전환합니다."},
      "ai-fallback":{title:"AI 실패·관망 시 수동 전환",desc:"AI 판단을 주문 지시로 강제하지 않습니다.",u:["경고와 AI 의견을 확인한다.","매매가 필요하면 수동입력을 선택한다."],s:["자동 주문값을 비운다.","사용자가 입력한 값에도 동일한 안전 검증을 적용한다."],r:"AI 오류나 관망 의견이 자동매수로 연결되지 않습니다."},
      "trade-mode":{title:"매매 방식 선택",desc:"단일과 분할 중 하나를 사용자가 명시적으로 선택합니다.",u:["단일매매 또는 3분할매매를 선택한다."],s:["선택 전 실행 버튼을 비활성화한다.","선택한 모드에 맞는 입력폼과 AI 기본값을 구성한다."],r:"단일은 1개 회차, 분할은 30 / 30 / 40 기본 비중으로 설정됩니다."},
      "single-setup":{title:"단일매매 설정",desc:"한 번의 진입 주문을 위한 가격과 금액을 확인합니다.",u:["총 매수금액을 확인하거나 감액한다.","진입가·목표가·손절가를 검토한다.","최종 확인을 누른다."],s:["안전 최대금액과 정수주 수량을 계산한다.","가격순서·호가단위·손익비를 검증한다."],r:"검증된 단일 회차가 최종 확인 화면으로 전달됩니다."},
      "split-setup":{title:"3분할매매 설정",desc:"회차별 진입가와 30/30/40 배분을 확인합니다.",u:["총 매수금액을 확인하거나 감액한다.","3개 진입가·비중·공통 목표/손절을 검토한다.","최종 확인을 누른다."],s:["브로커 현금과 안전한도를 조회한다.","회차별 정수주 수량과 실제 주문금액을 계산한다.","가격순서·비중합계·호가단위를 검증한다."],r:"한 주기에 한 회차만 주문하는 3개 회차 계획이 생성됩니다."},
      "safe-budget":{title:"안전 최대금액 계산",desc:"‘주문가능 현금’과 ‘실제로 허용할 금액’을 구분합니다.",u:["제안한도를 확인하고 필요하면 더 낮은 금액을 입력한다."],s:["가용현금, 종목 노출, 포트폴리오 여력, 손절 위험을 계산한다.","네 한도 중 최솟값을 안전 최대금액으로 제시한다."],r:"사용자는 안전한도보다 증액할 수 없습니다."},
      "validation":{title:"입력 검증과 오류",desc:"주문 전 잘못된 입력과 운영 상태를 차단합니다.",u:["오류 메시지에 따라 가격·비중·금액을 수정한다."],s:["가격순서·비중 100%·호가단위·잔고를 검증한다.","중복 종목과 자동매매 비활성 상태를 차단한다."],r:"모든 오류가 해소될 때만 최종 확인이 활성화됩니다."},
      "confirm":{title:"REAL/PAPER 최종 확인",desc:"실행 직전에 계좌·금액·손절가를 다시 확인합니다.",u:["계좌 모드와 최대 투입금액을 확인한다.","‘매매 실행·즉시 무장’을 누른다."],s:["잔고와 안전 게이트를 다시 조회한다.","계획 저장과 ARMED 전환을 한 번에 처리한다."],r:"주문을 즉시 보내지 않고 워치 감시 상태로 등록합니다."},
      "armed":{title:"즉시 무장 완료",desc:"저장된 전략과 다음 자동 동작을 명확히 안내합니다.",u:["다음 진입 조건과 만료일을 확인한다.","워치리스트로 이동한다."],s:["60초마다 현재가를 조회한다.","첫 진입 조건이 충족되면 지정가 주문을 제출한다."],r:"ARMED 상태로 자동매수 감시가 시작됩니다."},

      if(id==="split-setup")return `${header("3분할매매 설정","회차별 진입가와 30 / 30 / 40 비중을 검토합니다.","KIS PAPER · 준비완료")}${setupCard(true)}`;
      if(id==="safe-budget")return `${header("안전 최대금액 계산","주문가능 현금 전액을 투자금으로 사용하지 않습니다.")}<section class="card"><div class="grid4"><div class="metric pin">${marker("system",1)}<span>① 가용현금</span><b>12,500,000원</b></div><div class="metric"><span>② 동일종목 잔여한도</span><b>10,000,000원</b></div><div class="metric"><span>③ 포트폴리오 여력</span><b>18,000,000원</b></div><div class="metric"><span>④ 손절 위험예산</span><b>11,200,000원</b></div></div><div style="text-align:center;font-size:24px;color:#67a8ff;margin:20px">교집합의 최솟값 ↓</div><div class="metric good pin" style="text-align:center;padding:18px">${marker("system",2)}<span>시스템 안전 최대금액</span><b style="font-size:24px">10,000,000원</b></div><div class="grid2" style="margin-top:10px"><div class="field pin">${marker("user",1)}<label>사용자 선택 총 매수금액 · 감액만 가능</label><input value="9,900,000"></div><div class="callout good">안전한도 이내입니다.</div></div></section>`;
      if(id==="validation"){const msg=scenario||"3차 진입가는 2차 진입가보다 낮아야 합니다.";return `${header("입력 검증과 실행 차단","문제가 해소될 때까지 최종 확인을 비활성화합니다.","검증 오류")}<section class="card"><div class="callout error pin">${marker("system",1)}${msg}</div><table style="margin-top:10px"><thead><tr><th>검증 항목</th><th>현재 값</th><th>결과</th><th>조치</th></tr></thead><tbody><tr><td>가격순서</td><td>70,000 &gt; 67,000 &gt; 68,000</td><td><span class="pill red">실패</span></td><td>3차 가격 수정</td></tr><tr><td>비중합계</td><td>30 + 30 + 40</td><td><span class="pill green">통과</span></td><td>없음</td></tr><tr><td>호가단위</td><td>정상</td><td><span class="pill green">통과</span></td><td>없음</td></tr><tr><td>자동매매 게이트</td><td>${state.scenario==="gate-off"?"OFF":"ON"}</td><td><span class="pill ${state.scenario==="gate-off"?"red":"green"}">${state.scenario==="gate-off"?"실패":"통과"}</span></td><td>${state.scenario==="gate-off"?"운영설정 확인":"없음"}</td></tr></tbody></table><div class="action-row pin">${marker("user",1)}<button class="btn">값 수정</button><button class="btn primary" disabled>최종 확인</button></div></section>`;}
      if(id==="confirm"){const entries=state.tradeMode==="single"?[state.strategy.entries[0]]:state.strategy.entries,blocks=tradeBlocks(),blocked=blocks.length>0;return `${header("매매 실행 최종 확인","주문을 바로 제출하지 않고 워치 감시를 시작합니다.",blocked?"실행 차단":"KIS PAPER")}<section class="card"><div class="grid3"><div class="metric"><span>종목</span><b>삼성전자 005930</b></div><div class="metric"><span>방식</span><b>${state.tradeMode==="single"?"단일매매":"3분할매매"}</b></div><div class="metric ${blocked?"":"good"}"><span>최대 총액</span><b>${won(state.totalBudget)}</b></div></div><table style="margin-top:10px"><tbody><tr><td>진입계획</td><td>${entries.map(won).join(" / ")} · ${entries.length}회</td></tr><tr><td>공통 청산</td><td>목표 ${won(state.strategy.target)} · 손절 ${won(state.strategy.stop)}</td></tr><tr><td>감시주기</td><td>장중 60초 · 한 주기에 한 회차</td></tr><tr><td>유효기간</td><td>분석 기준일로부터 5거래일</td></tr></tbody></table><div class="callout ${blocked?"error":"warn"} pin" style="margin-top:10px">${marker("system",1)}${blocked?`재검증 실패: ${blocks.join(" · ")}. 문제를 해소해야 무장할 수 있습니다.`:"실행 직전 잔고·Kill Switch·중복·노출한도를 다시 확인했습니다."}</div><div class="action-row pin">${marker("user",1)}<button class="btn" onclick="go(state.tradeMode==='single'?'single-setup':'split-setup')">돌아가기</button><button class="btn primary" data-role="arm-strategy" ${blocked?"disabled":""} onclick="if(!${blocked})go('armed')">매매 실행 · 즉시 무장</button></div></section>`;}
      if(id==="armed"){const mode=state.tradeMode==="single"?"단일":"3분할";return `${header("전략이 워치리스트에 등록되었습니다","아직 주문은 제출되지 않았습니다.","ARMED")}<section class="card"><div class="callout good pin">${marker("system",1)}삼성전자 ${state.tradeMode==="single"?"단일":"3분할"} 전략을 ARMED 상태로 저장했습니다.</div><div class="grid3" style="margin-top:10px"><div class="metric"><span>다음 진입 조건</span><b>현재가 ≤ ${won(state.strategy.entries[0])}</b></div><div class="metric"><span>감시주기</span><b>장중 60초</b></div><div class="metric"><span>만료</span><b>5거래일 후</b></div></div><div class="card-sub" style="margin-top:10px">${mode==="단일"?"조건 충족 → 지정가 주문 → 체결 확인 → 목표·손절 감시":"조건 충족 → 지정가 주문 → 체결 확인 → 다음 회차 허용"}</div><div class="action-row pin">${marker("user",1)}<button class="btn primary" onclick="go('watchlist')">분석 워치리스트로 이동</button></div></section>`;}
      if(id==="watchlist"){const single=state.tradeMode==="single",totalLegs=single?1:3,filled=Math.min(totalLegs,state.filledLegs),plan=splitPlan(),planAmount=single?Math.floor(state.totalBudget/state.strategy.entries[0])*state.strategy.entries[0]:plan.reduce((sum,leg)=>sum+leg.amount,0),next=filled>=totalLegs?"목표/손절":`≤ ${won(state.strategy.entries[filled])}`;return `${header("분석 워치리스트","자동매수 진행상태와 다음 조건을 확인합니다.")}<section class="card"><table><thead><tr><th>종목</th><th>방식</th><th>현재가</th><th>진행</th><th>다음 조건</th><th>계획금액</th><th>상태</th></tr></thead><tbody><tr class="pin">${marker("system",1)}<td><b>삼성전자</b><br><span class="card-sub">005930</span></td><td>${single?"단일":"3분할"}</td><td class="mono">69,800원</td><td><b>${filled}/${totalLegs} 체결</b><div class="progress">${Array.from({length:totalLegs},(_,i)=>`<span class="${filled>i?"done":filled===i?"active":""}"></span>`).join("")}</div></td><td>${next}</td><td>${won(planAmount)}</td><td><span class="pill ${filled?"green":"orange"}">${filled?"BOUGHT":"ARMED"}</span></td></tr></tbody></table><div class="action-row pin">${marker("user",1)}<button class="btn primary" onclick="go('leg-detail')">${single?"주문":"회차"} 상세 보기</button></div></section>`;}
      if(id==="leg-detail"){const single=state.tradeMode==="single",partial=state.scenario==="partial",plan=splitPlan(),status=partial||state.filledLegs?"BOUGHT":"ARMED";if(single){const qty=Math.floor(state.totalBudget/state.strategy.entries[0]),filled=state.filledLegs?qty:0;return `${header("삼성전자 · 단일 주문 상세","주문 체결과 공통 청산 상태를 확인합니다.",status)}<section class="card pin">${marker("system",1)}<table><thead><tr><th>진입가</th><th>계획</th><th>체결</th><th>잔량</th><th>상태</th></tr></thead><tbody><tr><td>${won(state.strategy.entries[0])}</td><td>${qty}주</td><td>${filled}주</td><td>${qty-filled}주</td><td><span class="pill ${filled?"green":"blue"}">${filled?"FILLED":"PENDING"}</span></td></tr></tbody></table><div class="callout good" style="margin-top:9px">목표 ${won(state.strategy.target)} · 손절 ${won(state.strategy.stop)} 감시</div></section>`;}const rows=plan.map((leg,i)=>{const filled=partial?(i===0?leg.qty:i===1?Math.min(18,leg.qty):0):(i<state.filledLegs?leg.qty:0),remaining=leg.qty-filled,label=filled===leg.qty?"FILLED":filled?"PARTIAL":"PENDING",color=label==="FILLED"?"green":label==="PARTIAL"?"orange":"gray";return `<tr><td>${i+1}차</td><td>${won(leg.price)}</td><td>${leg.qty}주</td><td>${filled}주</td><td>${remaining}주</td><td><span class="pill ${color}">${label}</span></td></tr>`}).join("");return `${header("삼성전자 · 분할 회차 상세","주문·부분체결·잔량과 공통 청산 상태를 확인합니다.",status)}<section class="card pin">${marker("system",1)}<table><thead><tr><th>회차</th><th>진입가</th><th>계획</th><th>체결</th><th>잔량</th><th>상태</th></tr></thead><tbody>${rows}</tbody></table><div class="callout good" style="margin-top:9px">보유분 목표 ${won(state.strategy.target)} · 손절 ${won(state.strategy.stop)} 감시 중</div><div class="action-row pin">${marker("user",1)}<button class="btn" onclick="state.filledLegs=Math.min(3,state.filledLegs+1);render()">다음 체결 시뮬레이션</button><button class="btn danger">남은 매수 중단</button></div></section>`;}
      if(id==="mobile"){const single=state.tradeMode==="single";return `${header("모바일 분석 워치리스트","웹에서 설정한 전략을 모바일에서 확인합니다.")}<div class="mobile-shell pin">${marker("user",1)}<div class="mobile-head"><b>분석 워치리스트</b><span>새로고침</span></div><div class="mobile-card"><div style="display:flex;justify-content:space-between"><b>삼성전자</b><span class="pill green">BOUGHT</span></div><p>${single?"단일 · 1/1":"3분할 · 1/3"} 체결</p><div class="progress"><span class="done"></span>${single?"":"<span class=\"active\"></span><span></span>"}</div><p>평균체결 69,850원<br>${single?"청산 감시 중":`다음 진입 ≤ ${won(state.strategy.entries[1])}`}<br>목표 ${won(state.strategy.target)} · 손절 ${won(state.strategy.stop)}</p><button class="btn danger" style="width:100%">남은 매수 중단</button></div><div class="mobile-card"><b>시스템 상태</b><p style="color:#86efac">60초 감시 정상 · 주문 게이트 ON</p></div></div>`;}
      return `${header("상태 흐름과 검수 기준","신규매수 차단과 보유분 청산 관리를 분리합니다.")}<div class="state-flow"><div class="state-node">WATCH<br><small>관찰</small></div><b>→</b><div class="state-node">ARMED<br><small>진입 감시</small></div><b>→</b><div class="state-node">BOUGHT<br><small>추가매수+청산 감시</small></div><b>→</b><div class="state-node">CLOSED<br><small>익절·손절 완료</small></div></div><section class="card pin">${marker("system",1)}<div class="card-title">검수 체크리스트</div><div class="checklist">✓ 단일/분할 명시 선택<br>✓ 주문가능 현금과 안전한도 구분<br>✓ 30 / 30 / 40 정수주 계산<br>✓ 한 주기에 한 회차만 주문<br>✓ 부분체결 잔량만 재주문<br>✓ 현금 부족 시 수량 축소 없이 보류<br>✓ 만료 시 신규매수만 중단<br>✓ BOUGHT 청산 감시 계속<br>✓ 웹·모바일 진행상태 일치<br>✓ 예시 HTML은 네트워크 호출 없음</div></section>`;
    }
    function renderAnnotation(){const m=META[state.screen];document.getElementById("annotationTitle").textContent=m.title;document.getElementById("annotationDesc").textContent=m.desc;document.getElementById("userActions").innerHTML=m.u.map((x,i)=>`<li><b>U${i+1}</b> ${x}</li>`).join("");document.getElementById("systemActions").innerHTML=m.s.map((x,i)=>`<li><b>S${i+1}</b> ${x}</li>`).join("");document.getElementById("screenResult").textContent=m.r;}
    function render(){document.getElementById("workspace").innerHTML=renderScreen(state.screen);document.getElementById("screenSelect").value=state.screen;document.getElementById("scenarioSelect").value=state.scenario;document.getElementById("accountBadge").textContent=state.scenario==="gate-off"?"KIS PAPER · 자동매매 비활성":"KIS PAPER · 자동매매 준비완료";renderAnnotation();const url=new URL(location.href);url.searchParams.set("screen",state.screen);url.searchParams.set("scenario",state.scenario);history.replaceState(null,"",url);}
    const screenSelect=document.getElementById("screenSelect");SCREEN_ORDER.forEach(id=>{const o=document.createElement("option");o.value=id;o.textContent=META[id].title;screenSelect.appendChild(o)});screenSelect.onchange=e=>go(e.target.value);document.getElementById("scenarioSelect").onchange=e=>{state.scenario=e.target.value;render()};document.getElementById("prevBtn").onclick=()=>go(SCREEN_ORDER[Math.max(0,SCREEN_ORDER.indexOf(state.screen)-1)]);document.getElementById("nextBtn").onclick=()=>go(SCREEN_ORDER[Math.min(SCREEN_ORDER.length-1,SCREEN_ORDER.indexOf(state.screen)+1)]);
    const params=new URLSearchParams(location.search);if(META[params.get("screen")])state.screen=params.get("screen");if(document.querySelector(`#scenarioSelect option[value="${params.get("scenario")}"]`))state.scenario=params.get("scenario");if(params.get("capture")==="1")document.body.classList.add("capture");if(["single-setup"].includes(state.screen))state.tradeMode="single";if(["split-setup","confirm","armed","watchlist","leg-detail","mobile"].includes(state.screen))state.tradeMode="split";if(["single","split"].includes(params.get("mode")))state.tradeMode=params.get("mode");render();
  </script>
</body>
</html>
